---
- name: Lab 01 - primo Job e idempotenza
  hosts: app_servers
  gather_facts: true
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"

  tasks:
    - name: Crea la directory radice del laboratorio
      ansible.builtin.file:
        path: "{{ lab_root_effective }}"
        state: directory
        mode: '0755'

    - name: Mostra target e sistema operativo
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} -
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_major_version'] }}
