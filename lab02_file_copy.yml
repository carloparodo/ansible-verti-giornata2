---
- name: Lab 02 - file e copy
  hosts: app_servers
  gather_facts: false
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"
    lab_message_effective: "{{ lab_message | default('Gestito da Ansible - Giornata 2') }}"

  tasks:
    - name: Assicura la directory del laboratorio
      ansible.builtin.file:
        path: "{{ lab_root_effective }}"
        state: directory
        mode: '0755'

    - name: Scrive il README gestito
      ansible.builtin.copy:
        dest: "{{ lab_root_effective }}/README.txt"
        content: |
          {{ lab_message_effective }}
          Host AAP: {{ inventory_hostname }}
        mode: '0644'
