---
- name: Lab 08 - loop su una lista
  hosts: app_servers
  gather_facts: false
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"
    lab_dirs_default:
      - config
      - data
      - logs

  tasks:
    - name: Assicura la directory radice
      ansible.builtin.file:
        path: "{{ lab_root_effective }}"
        state: directory
        mode: '0755'

    - name: Crea le sottodirectory applicative
      ansible.builtin.file:
        path: "{{ lab_root_effective }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ lab_dirs | default(lab_dirs_default) }}"

    - name: Mostra la lista richiesta
      ansible.builtin.debug:
        var: lab_dirs
