---
- name: Bonus 01 - matrice di variabili
  hosts: app_servers
  gather_facts: false
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"
    environment_effective: "{{ environment | default('test') }}"
    application_port_effective: "{{ application_port | default(8080) }}"

  tasks:
    - name: Riscrive un file parametrico
      ansible.builtin.copy:
        dest: "{{ lab_root_effective }}/matrix.conf"
        content: |
          environment={{ environment_effective }}
          application_port={{ application_port_effective }}
        mode: '0644'
