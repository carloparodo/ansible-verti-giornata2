---
- name: Bonus 04 - troubleshooting guidato
  hosts: app_servers
  gather_facts: false
  become: false
  vars:
    expected_word_effective: "{{ expected_word | default('ANSIBLE') }}"

  tasks:
    - name: Genera un output di verifica
      ansible.builtin.command:
        cmd: /usr/bin/printf 'ANSIBLE\n'
      register: probe
      changed_when: false

    - name: Verifica che l'output contenga il valore atteso
      ansible.builtin.assert:
        that:
          - expected_word_effective in probe.stdout
        fail_msg: >-
          Il valore atteso '{{ expected_word_effective }}' non compare
          nell'output '{{ probe.stdout }}'
        success_msg: "Output coerente con il valore atteso"
