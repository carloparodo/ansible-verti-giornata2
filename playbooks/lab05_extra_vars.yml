---
- name: Lab 05 - variabili da Job Template
  hosts: app_servers
  gather_facts: false
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"
    environment_effective: "{{ environment | default('test') }}"
    application_port_effective: "{{ application_port | default(8080) }}"

  tasks:
    - name: Assicura la directory del laboratorio
      ansible.builtin.file:
        path: "{{ lab_root_effective }}"
        state: directory
        mode: '0755'

    - name: Scrive parametri applicativi
      ansible.builtin.copy:
        dest: "{{ lab_root_effective }}/application.conf"
        content: |
          environment={{ environment_effective }}
          application_port={{ application_port_effective }}
          inventory_host={{ inventory_hostname }}
        mode: '0644'

    - name: Mostra i valori risolti
      ansible.builtin.debug:
        msg: >-
          environment={{ environment_effective }},
          port={{ application_port_effective }}
