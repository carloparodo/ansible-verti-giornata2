---
- name: Lab 03 - gruppo e account tecnico
  hosts: app_servers
  gather_facts: false
  become: true
  vars:
    lab_root_effective: "{{ lab_root | default('/tmp/ansible_d2') }}"
    lab_group_effective: "{{ lab_group | default('ansible_lab') }}"
    lab_user_effective: "{{ lab_user | default('ansible_lab') }}"

  tasks:
    - name: Crea il gruppo tecnico di laboratorio
      ansible.builtin.group:
        name: "{{ lab_group_effective }}"
        state: present

    - name: Crea l'account tecnico senza login interattivo
      ansible.builtin.user:
        name: "{{ lab_user_effective }}"
        group: "{{ lab_group_effective }}"
        shell: /sbin/nologin
        create_home: false
        state: present

    - name: Assicura la directory del laboratorio
      ansible.builtin.file:
        path: "{{ lab_root_effective }}"
        state: directory
        owner: "{{ lab_user_effective }}"
        group: "{{ lab_group_effective }}"
        mode: '0755'

    - name: Verifica l'identita tecnica
      ansible.builtin.command:
        cmd: "id {{ lab_user_effective }}"
      register: lab_identity
      changed_when: false

    - name: Mostra la verifica dell'account
      ansible.builtin.debug:
        var: lab_identity.stdout
